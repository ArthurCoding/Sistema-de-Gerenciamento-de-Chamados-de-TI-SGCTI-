<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGCTI - Chamados de TI</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f2f5f4;color:#222}
  header{background:#14303a;color:#fff;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  header h1{font-size:18px;margin:0 20px 0 0}
  header button{background:none;border:0;color:#cde;padding:8px 12px;cursor:pointer;border-radius:6px}
  header button.ativo{background:#ffffff30;color:#fff;font-weight:bold}
  main{max-width:1000px;margin:20px auto;padding:0 16px}
  form{background:#fff;padding:14px;border-radius:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
  label{display:flex;flex-direction:column;font-size:13px;gap:3px;text-transform:capitalize}
  input,select,textarea,button{font:inherit;padding:6px 8px}
  button.acao{background:#1f8a5b;color:#fff;border:0;border-radius:6px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px}
  th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
  .cinza{background:#ddd;border:0;border-radius:6px;cursor:pointer;margin:1px}
  @media print{header,form,.nao-imprimir{display:none}}
</style>
</head>
<body>
<header>
  <h1>SGCTI</h1>
  <button id="b-chamados" onclick="ir('chamados')">Chamados</button>
  <button id="b-tecnicos" onclick="ir('tecnicos')">Técnicos</button>
  <button id="b-usuarios" onclick="ir('usuarios')">Usuários</button>
  <button id="b-relatorio" onclick="ir('relatorio')">Relatórios</button>
  <label style="color:#fff;margin-left:auto">Perfil
    <select id="perfil"><option>Administrador</option><option>Técnico</option></select>
  </label>
</header>
<main id="tela"></main>

<script>
// ===== 1. DADOS (ficam na memória; no sistema real viriam do MySQL) =====
const db = {
  tecnicos: [{id:1, nome:'Rafael Monteiro', cpf:'52998224725', especialidade:'Redes', email:'rafael@empresa.com', telefone:'85999112233'}],
  usuarios: [{id:2, nome:'Ana Lima', setor:'Financeiro', email:'ana@empresa.com', telefone:'85997011020'}],
  chamados: [{id:3, titulo:'Sem acesso à rede', descricao:'Notebook não conecta.', prioridade:'Alta',
              usuario:2, tecnico:1, status:'Aberto', abertura:'2026-10-01', fechamento:null}]
};
let seq = 4;            // gerador de IDs
let aba = 'chamados';   // aba atual
let editando = null;    // registro em edição: {tipo, registro}
let rel = null;         // configuração do relatório gerado
const filtro = {status:'', tecnico:'', de:'', ate:''};
const campos = {        // atributos de cada cadastro (seção 4.1 e 4.2 do PDF)
  tecnicos: ['nome','cpf','especialidade','email','telefone'],
  usuarios: ['nome','setor','email','telefone']
};

// ===== 2. FUNÇÕES AUXILIARES =====
const hoje = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nome = (lista, id) => (db[lista].find(x => x.id == id) || {nome:'—'}).nome;
const opcoes = (lista, sel, vazio) =>
  `<option value="">${vazio}</option>` + db[lista].map(x => `<option value="${x.id}" ${x.id == sel ? 'selected' : ''}>${esc(x.nome)}</option>`).join('');
const lista = (itens, sel) => itens.map(i => `<option ${i == sel ? 'selected' : ''}>${i}</option>`).join('');

function ir(a){ aba = a; editando = null; render(); }

// ===== 3. CADASTROS: TÉCNICO E USUÁRIO (RF01 a RF08) =====
function telaCadastro(tipo){
  const reg = editando && editando.tipo === tipo ? editando.registro : {};
  const form = `<form onsubmit="salvar(event,'${tipo}')">` +
    campos[tipo].map(c => `<label>${c}<input name="${c}" value="${esc(reg[c])}" required></label>`).join('') +
    `<button class="acao">Salvar</button></form>`;
  const linhas = db[tipo].map(r => `<tr>${campos[tipo].map(c => `<td>${esc(r[c])}</td>`).join('')}
    <td><button class="cinza" onclick="editar('${tipo}',${r.id})">Editar</button>
        <button class="cinza" onclick="excluir('${tipo}',${r.id})">Excluir</button></td></tr>`).join('');
  return form + `<table><tr>${campos[tipo].map(c => `<th>${c}</th>`).join('')}<th></th></tr>${linhas}</table>`;
}

function salvar(e, tipo){            // criar (C) ou atualizar (U)
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(e.target));
  if (tipo === 'tecnicos' && dados.cpf.replace(/\D/g,'').length !== 11) return alert('CPF deve ter 11 dígitos.');
  if (!dados.email.includes('@')) return alert('E-mail inválido.');
  if (editando) Object.assign(editando.registro, dados);
  else db[tipo].push({id: seq++, ...dados});
  editando = null; render();
}

function editar(tipo, id){ editando = {tipo, registro: db[tipo].find(x => x.id === id)}; render(); }

function excluir(tipo, id){          // D: não exclui quem tem chamados (integridade, RNF10)
  const campo = tipo === 'tecnicos' ? 'tecnico' : 'usuario';
  if (db.chamados.some(c => c[campo] === id)) return alert('Existem chamados vinculados. Não é possível excluir.');
  if (confirm('Excluir este cadastro?')) { db[tipo] = db[tipo].filter(x => x.id !== id); render(); }
}

// ===== 4. CHAMADOS (RF09 a RF16) =====
function telaChamados(){
  const c = editando && editando.tipo === 'chamados' ? editando.registro : {};
  const form = `<form onsubmit="salvarChamado(event)">
    <label>título<input name="titulo" value="${esc(c.titulo)}" required></label>
    <label>descrição<textarea name="descricao" required>${esc(c.descricao)}</textarea></label>
    <label>prioridade<select name="prioridade">${lista(['Baixa','Média','Alta'], c.prioridade)}</select></label>
    <label>solicitante<select name="usuario">${opcoes('usuarios', c.usuario, 'Selecione')}</select></label>
    <label>técnico<select name="tecnico">${opcoes('tecnicos', c.tecnico, 'Sem técnico')}</select></label>
    <button class="acao">${editando ? 'Salvar alterações' : 'Abrir chamado'}</button></form>`;

  const filtros = `<form>
    <label>status<select onchange="filtro.status=this.value;render()">${opcoes2(['Aberto','Em Atendimento','Resolvido','Cancelado'], filtro.status)}</select></label>
    <label>técnico<select onchange="filtro.tecnico=this.value;render()">${opcoes('tecnicos', filtro.tecnico, 'Todos')}</select></label>
    <label>de<input type="date" value="${filtro.de}" onchange="filtro.de=this.value;render()"></label>
    <label>até<input type="date" value="${filtro.ate}" onchange="filtro.ate=this.value;render()"></label></form>`;

  const linhas = filtrar().map(c => `<tr>
    <td>${c.id}</td><td>${esc(c.titulo)}</td><td>${esc(nome('usuarios', c.usuario))}</td>
    <td>${esc(nome('tecnicos', c.tecnico))}</td><td>${c.prioridade}</td><td>${c.status}</td>
    <td>${c.abertura}</td><td>${c.fechamento || '—'}</td>
    <td>${botoes(c)}</td></tr>`).join('');
  return form + filtros + `<table><tr><th>#</th><th>Título</th><th>Solicitante</th><th>Técnico</th><th>Prioridade</th>
    <th>Status</th><th>Abertura</th><th>Fechamento</th><th></th></tr>${linhas}</table>`;
}

const opcoes2 = (itens, sel) => `<option value="">Todos</option>` + lista(itens, sel);

function botoes(c){                  // botões de acordo com o status
  let b = `<button class="cinza" onclick="editarChamado(${c.id})">Editar</button>`;
  if (c.status === 'Aberto') b += `<button class="cinza" onclick="mudarStatus(${c.id},'Em Atendimento')">Iniciar</button>`;
  if (c.status === 'Em Atendimento') b += `<button class="cinza" onclick="mudarStatus(${c.id},'Resolvido')">Resolver</button>`;
  if (c.status === 'Aberto' || c.status === 'Em Atendimento') b += `<button class="cinza" onclick="mudarStatus(${c.id},'Cancelado')">Cancelar</button>`;
  return b + `<button class="cinza" onclick="excluirChamado(${c.id})">Excluir</button>`;
}

function filtrar(){                  // RF16: filtro por status, técnico ou período
  return db.chamados.filter(c =>
    (!filtro.status || c.status === filtro.status) &&
    (!filtro.tecnico || c.tecnico == filtro.tecnico) &&
    (!filtro.de || c.abertura >= filtro.de) &&
    (!filtro.ate || c.abertura <= filtro.ate));
}

function salvarChamado(e){
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (!f.usuario) return alert('RN01: todo chamado precisa de um usuário solicitante.');
  const dados = {titulo: f.titulo, descricao: f.descricao, prioridade: f.prioridade,
                 usuario: +f.usuario, tecnico: f.tecnico ? +f.tecnico : null};   // RN02: um técnico por vez
  if (editando) {
    if (editando.registro.status === 'Em Atendimento' && !dados.tecnico) return alert('Chamado em atendimento precisa de técnico.');
    Object.assign(editando.registro, dados);
  } else {
    db.chamados.push({id: seq++, ...dados, status:'Aberto', abertura: hoje(), fechamento: null}); // RN03
  }
  editando = null; render();
}

function editarChamado(id){
  const c = db.chamados.find(x => x.id === id);
  if (c.status === 'Resolvido' || c.status === 'Cancelado') return alert('Chamados encerrados não podem ser editados.');
  editando = {tipo:'chamados', registro:c}; render();
}

function mudarStatus(id, novo){      // RF14 + regras RN04 e RN05
  const c = db.chamados.find(x => x.id === id);
  const somenteTecnico = novo === 'Em Atendimento' || novo === 'Resolvido';
  if (somenteTecnico && document.getElementById('perfil').value !== 'Técnico')
    return alert('RN04: apenas técnicos podem iniciar ou resolver chamados. Troque o perfil.');
  if (somenteTecnico && !c.tecnico) return alert('RF13: atribua um técnico ao chamado antes (botão Editar).');
  c.status = novo;
  c.fechamento = novo === 'Resolvido' ? hoje() : null;   // RN05
  render();
}

function excluirChamado(id){
  const c = db.chamados.find(x => x.id === id);
  if (c.status === 'Resolvido') return alert('RN06: chamados resolvidos não podem ser excluídos.');
  if (confirm('Excluir este chamado?')) { db.chamados = db.chamados.filter(x => x.id !== id); render(); }
}

// ===== 5. RELATÓRIOS (RF17 a RF19) =====
function telaRelatorio(){
  const r = rel || {tipo:'status', de:'', ate:''};
  let saida = '';
  if (rel) {
    const itens = db.chamados.filter(c => (!r.de || c.abertura >= r.de) && (!r.ate || c.abertura <= r.ate));
    const chave = c => r.tipo === 'tecnico' ? nome('tecnicos', c.tecnico) : r.tipo === 'status' ? c.status : c.abertura.slice(0,7);
    const total = {};
    itens.forEach(c => total[chave(c)] = (total[chave(c)] || 0) + 1);
    saida = `<h2>Chamados por ${r.tipo === 'periodo' ? 'período (mês)' : r.tipo}</h2>
      <table><tr><th>Grupo</th><th>Quantidade</th></tr>
      ${Object.keys(total).sort().map(k => `<tr><td>${esc(k)}</td><td>${total[k]}</td></tr>`).join('')}
      <tr><th>Total</th><th>${itens.length}</th></tr></table>`;
  }
  return `<form class="nao-imprimir">
    <label>tipo<select id="r-tipo"><option value="periodo" ${r.tipo==='periodo'?'selected':''}>Por período</option>
      <option value="tecnico" ${r.tipo==='tecnico'?'selected':''}>Por técnico</option>
      <option value="status" ${r.tipo==='status'?'selected':''}>Por status</option></select></label>
    <label>de<input type="date" id="r-de" value="${r.de}"></label>
    <label>até<input type="date" id="r-ate" value="${r.ate}"></label>
    <button type="button" class="acao" onclick="gerar()">Gerar</button>
    <button type="button" class="acao" onclick="window.print()">Exportar PDF</button></form>` + saida;
}

function gerar(){
  rel = {tipo: document.getElementById('r-tipo').value, de: document.getElementById('r-de').value, ate: document.getElementById('r-ate').value};
  render();
}

// ===== 6. TELA PRINCIPAL: escolhe o que desenhar =====
function render(){
  ['chamados','tecnicos','usuarios','relatorio'].forEach(a =>
    document.getElementById('b-' + a).className = a === aba ? 'ativo' : '');
  document.getElementById('tela').innerHTML =
    aba === 'chamados' ? telaChamados() :
    aba === 'relatorio' ? telaRelatorio() : telaCadastro(aba);
}
render();
</script>
</body>
</html>
